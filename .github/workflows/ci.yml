# Automatic checks on every push and pull request.
#  1. "checks": lint, typecheck, unit + database tests, build (same as `npm run check`).
#  2. "click-through": starts a local Supabase, runs the built app and clicks
#     through it in a real browser (laptop and phone sizes).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cp_test
      # Placeholder settings so the build works; nothing connects to them.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the test database
        run: npm run db:test:setup
      - name: Lint, typecheck, tests, build
        run: npm run check

  click-through:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a local Supabase (database, login, API) with all migrations
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - name: Write the app's settings
        run: |
          npx supabase status -o json > /tmp/sb.json
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' /tmp/sb.json)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' /tmp/sb.json)"
            echo "SUPABASE_SECRET_KEY=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' /tmp/sb.json)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "SMS_PROVIDER=simulator"
            echo "CRON_SECRET=ci-cron-secret"
            echo "FILE_STORAGE=local"
            echo "FILE_SIGNING_SECRET=ci-file-signing-secret"
            echo "DEMO_MODE=on"
            echo "DEMO_STARTS_PER_HOUR=500"
          } > .env.local
      - run: npm run build
      - name: Start the app
        run: |
          npx next start -p 3000 > /tmp/app.log 2>&1 &
          npx --yes wait-on --timeout 60000 http://localhost:3000/login
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Click through the app
        run: npm run e2e
      - name: App log (on failure)
        if: failure()
        run: tail -200 /tmp/app.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build the standalone deployment image
        run: |
          docker build -t lowcountry-release \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 .
      - name: Verify unprivileged runtime and fail-closed health
        run: |
          docker run -d --name lowcountry-runtime -p 127.0.0.1:3000:3000 \
            -e SUPABASE_SECRET_KEY=ci-placeholder lowcountry-release
          trap 'docker logs lowcountry-runtime; docker rm -f lowcountry-runtime' EXIT
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          test "$(docker exec lowcountry-runtime id -u)" != 0
          docker exec -i lowcountry-runtime node - <<'NODE'
          (async () => {
            const assert = require('node:assert/strict');
            const origin = 'http://127.0.0.1:3000';
            const health = await fetch(origin+'/api/health');
            assert.equal(health.status, 503);
            assert.deepEqual(await health.json(), {status:'unavailable'});
            const login = await fetch(origin+'/login');
            assert.equal(login.status, 200);
            assert.equal(login.headers.get('x-frame-options'), 'DENY');
            await login.arrayBuffer();
            const privatePage = await fetch(origin+'/dashboard', {redirect:'manual'});
            assert.equal(privatePage.status, 307);
            assert.equal(new URL(privatePage.headers.get('location'), origin).pathname, '/login');
            await privatePage.arrayBuffer();
            for (const method of ['GET','POST']) {
              const cron = await fetch(origin+'/api/cron/dispatch', {method});
              assert.equal(cron.status, 401);
              await cron.arrayBuffer();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
